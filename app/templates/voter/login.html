{% extends "base.html" %}

{% block title %}Voter Login - ROHIT VOTING SYSTEM{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
                <div class="page-kicker mb-2">Voter access</div>
            <div class="card">
                <div class="card-header text-center">
                        <h3 class="mb-0">Voter Login</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('voter.voter_login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required autofocus placeholder="Enter your registered phone number">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <small class="text-secondary">
                    Use your registered phone number to login
                </small>
            </div>
            <div class="text-center mt-2">
                <a href="{{ url_for('voter.vote_entry') }}" class="text-secondary">← Back to Voter Access</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
