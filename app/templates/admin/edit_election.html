{% extends "base.html" %}

{% block title %}Edit Election - ROHIT VOTING SYSTEM{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4"><div class="col-12"><h2>Edit Election</h2><a href="{{ url_for('admin.view_election', election_id=election.id) }}" class="btn btn-outline-light">Back to Election</a></div></div>
    <div class="row"><div class="col-md-8"><div class="card"><div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label for="title" class="form-label">Election Title *</label><input type="text" class="form-control" id="title" name="title" value="{{ election.title }}" required></div>
            <div class="mb-3"><label for="description" class="form-label">Description</label><textarea class="form-control" id="description" name="description" rows="3">{{ election.description or '' }}</textarea></div>
            <div class="mb-3"><label for="start_time" class="form-label">Start Time *</label><input type="datetime-local" class="form-control" id="start_time" name="start_time" value="{{ election.start_time.strftime('%Y-%m-%dT%H:%M') }}" required></div>
            <div class="mb-3"><label for="end_time" class="form-label">End Time *</label><input type="datetime-local" class="form-control" id="end_time" name="end_time" value="{{ election.end_time.strftime('%Y-%m-%dT%H:%M') }}" required></div>
            <button type="submit" class="btn btn-primary">Update Election</button>
            <a href="{{ url_for('admin.view_election', election_id=election.id) }}" class="btn btn-outline-light">Cancel</a>
        </form>
    </div></div></div></div>
</div>
{% endblock %}
