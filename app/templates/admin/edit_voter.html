{% extends "base.html" %}

{% block title %}Edit Voter - ROHIT VOTING SYSTEM{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col-12">
            <h2>Edit Voter</h2>
            <a href="{{ url_for('admin.voters') }}" class="btn btn-outline-light">Back to Voters</a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required value="{{ voter.name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required value="{{ voter.phone }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="identity_reference" class="form-label">Identity Reference *</label>
                            <input type="text" class="form-control" id="identity_reference" name="identity_reference" required value="{{ voter.identity_reference }}">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Update Voter</button>
                        <a href="{{ url_for('admin.voters') }}" class="btn btn-outline-light">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
